project_id = "rose-v031-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = ["http://127.0.0.1:3101/staff/callback"]
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
max_frequency = "1s"

[auth.email.template.invite]
subject = "Invitation Rose Care Hub"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Récupération Rose Care Hub"
content_path = "./supabase/templates/recovery.html"
